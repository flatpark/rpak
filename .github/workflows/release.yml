name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint test dist GO=go GOFMT=gofmt
      - run: cd dist && sha256sum rpak-linux-* | tee SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/rpak-linux-* dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
